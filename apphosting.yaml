# Firebase App Hosting Configuration
# https://firebase.google.com/docs/app-hosting/configure

# Cloud Run compute allocation for Next.js SSR
runConfig:
  cpu: 1
  memoryMiB: 1024
  minInstances: 0
  maxInstances: 10
  concurrency: 80

# Environment variables
env:
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: technoarchitecture-7d718
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: technoarchitecture-7d718.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: technoarchitecture-7d718.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_STORAGE_BUCKET
    value: technoarchitecture-7d718.firebasestorage.app
    availability:
      - RUNTIME
  - variable: ADMIN_USERNAME
    value: admin
    availability:
      - RUNTIME
  - variable: ADMIN_PASSWORD
    secret: ADMIN_PASSWORD
    availability:
      - RUNTIME
  - variable: ADMIN_SESSION_SECRET
    secret: ADMIN_SESSION_SECRET
    availability:
      - RUNTIME
